name: Daily Resilience Digest

# Produces a once-daily, analyst-style summary of the retained alert window using
# Claude, and commits it to digests/. This is the layer keyword scoring can't do:
# judging whether a cluster of alerts actually matters to Rocket, deduplicating the
# same story across 20 news feeds, and mapping events to THIRA risk categories.
#
# SETUP REQUIRED (one-time):
#   Repo Settings > Secrets and variables > Actions > New repository secret
#     Name:  ANTHROPIC_API_KEY
#     Value: an Anthropic API key from the Rocket console
#   Without the secret this workflow skips cleanly — it never fails the repo.

on:
  schedule:
    # 11:30 UTC ≈ 7:30am ET — lands before the resilience team's morning review.
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for API key
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping digest." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate digest
        if: steps.guard.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-digest.js

      - name: Commit digest
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ latest-digest.json
          git diff --cached --quiet || git commit -m "chore: daily resilience digest [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
